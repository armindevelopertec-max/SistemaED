version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smia_db
      POSTGRES_USER: smia_user
      POSTGRES_PASSWORD: smia_password
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smia_user -d smia_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sistemaed-network

  redis:
    image: redis:7-alpine
    container_name: smia_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sistemaed-network

  minio:
    image: minio/minio
    container_name: smia_minio
    restart: unless-stopped
    command: server /data --console-address ":9021"
    environment:
      MINIO_ROOT_USER: smia_minio_root
      MINIO_ROOT_PASSWORD: smia_minio_password
    ports:
      - "9020:9000"
      - "9021:9021"
    volumes:
      - minio_data:/data
    networks:
      - sistemaed-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: smia_nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sistemaed-network

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  sistemaed-network:
    driver: bridge
